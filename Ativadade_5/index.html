<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Atividade - Formulário HTML e CSS</title>
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background-color: #2c3e50;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container-form {
      background-color: #ffffff;
      width: 100%;
      max-width: 550px; 
      padding: 30px;
      border-radius: 12px; 
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
    }

    h2 {
      text-align: center;
      color: #333;
      margin-bottom: 25px;
      font-size: 24px;
      border-bottom: 2px solid #3498db;
      padding-bottom: 10px;
    }

    h3{
      text-align: center;
      color: #333;
      margin-bottom: 15px;
      font-size: 16px;
      border-bottom: 1px solid #3498db;
      padding-bottom: 5px;
    }

    
    .campo-grupo {
      padding: 15px;
      margin-bottom: 20px;
      display: flex;
      flex-direction: column;
      border: solid 2px;
      border-width: 1px;
      border-radius: 10px;

    }

    .campo-grupo label {
      margin-bottom: 6px;
      color: #444;
      font-weight: bold;
      font-size: 14px;
    }
    
    .campo-final{
      margin-bottom: 20px;
      display: flex;
      flex-direction: column;
    }

    .campo-final label {
      margin-bottom: 6px;
      color: #444;
      font-weight: bold;
      font-size: 14px;
    }

    /* Estilizaçao padrao para campos de texto, e-mail, senha, data e select */
    .input-padrao, select, textarea {
      width: 100%;
      padding: 10px 12px;
      border: 2px solid #ccc;
      border-radius: 6px;
      font-size: 15px;
      color: #333;
      outline: none;
      transition: all 0.3s ease;
    }

    /* Efeito focar */
    .input-padrao:focus, select:focus, textarea:focus {
      border-color: #3498db;
      box-shadow: 0 0 8px rgba(52, 152, 219, 0.3);
      background-color: #f9fbfd;
    }

    /* Organizaçao para campos de seleçao multipla (Radio e Checkbox) */
    .opcoes-grupo {
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
      margin-top: 5px;
    }

    .opcao-item {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 15px;
      cursor: pointer;
    }

    .opcao-item input {
      cursor: pointer;
      width: 16px;
      height: 16px;
    }

    .input-file {
      background-color: #f8f9fa;
      padding: 8px;
      border: 2px dashed #bbb;
      border-radius: 6px;
      cursor: pointer;
    }

    /* Textarea dos comentarios */
    textarea {
      resize: vertical;
      min-height: 80px;
    }

    .botoes-container {
      display: flex;
      gap: 15px;
      margin-top: 25px;
    }

    button {
      flex: 1;
      padding: 12px;
      font-size: 16px;
      font-weight: bold;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: background-color 0.3s ease, transform 0.1s ease;
    }

    .btn-enviar {
      background-color: #2ecc71;
      color: white;
    }

    .btn-limpar {
      background-color: #e74c3c;
      color: white;
    }

    /* Hover nos botoes */
    .btn-enviar:hover {
      background-color: #27ae60;
    }

    .btn-limpar:hover {
      background-color: #c0392b;
    }

    button:active {
      transform: scale(0.98);
    }

    @media (max-width: 480px) {
      .container-form {
        padding: 20px;
      }
      
      .botoes-container {
        flex-direction: column; /* Botões empilham no celular */
        gap: 10px;
      }
      
      .opcoes-grupo {
        flex-direction: column;
        gap: 8px;
      }
    }
  </style>
</head>
<body>
    
  <div class="container-form">
    <h2>Cadastro Acadêmico</h2>
    
    <form action="#" method="POST">

      
      <section class="campo-grupo">
        <h3>Dados Pessoais</h3>
      <div>
        <label for="nome" id="nome">Nome Completo:</label>
        <input type="text" id="nome" class="input-padrao" placeholder="Digite seu nome" required>
      </div>

      <div>
        <label for="email" id="email">E-mail:</label>
        <input type="email" id="email" class="input-padrao" placeholder="exemplo@email.com" required>
      </div>

      <div>
        <label for="senha" id="senha">Senha:</label>
        <input type="password" id="senha" class="input-padrao" placeholder="Crie uma senha" required>
      </div>

      <div>
        <label for="nascimento" id="nascimento">Data de Nascimento:</label>
        <input type="date" id="nascimento" class="input-padrao" required>
      </div>

      <div>
        <label>Sexo:</label>
        <div class="opcoes-grupo">
          <label class="opcao-item">
            <input type="radio" name="sexo" value="masculino" required> Masculino
          </label>
          <label class="opcao-item">
            <input type="radio" name="sexo" value="feminino"> Feminino
          </label>
          <label class="opcao-item">
            <input type="radio" name="sexo" value="outro"> Outro
          </label>
        </div>
      </div>
      </section>

      <section class="campo-grupo">
      <div>
        <label for="curso">Curso:</label>
        <select id="curso" name="curso" required>
          <option value="" disabled selected>Selecione seu curso...</option>
          <option value="ads">Análise e Desenvolvimento de Sistemas</option>
          <option value="cc">Ciência da Computação</option>
          <option value="si">Sistemas de Informação</option>
          <option value="ge">Gestão da Tecnologia da Informação</option>
        </select>
      </div>

      <div>
        <label>Interesses:</label>
        <div class="opcoes-grupo">
          <label class="opcao-item">
            <input type="checkbox" name="interesses" value="frontend"> Front-End
          </label>
          <label class="opcao-item">
            <input type="checkbox" name="interesses" value="backend"> Back-End
          </label>
          <label class="opcao-item">
            <input type="checkbox" name="interesses" value="mobile"> Mobile
          </label>
          <label class="opcao-item">
            <input type="checkbox" name="interesses" value="dados"> Ciência de Dados
          </label>
        </div>
      </div>

      </section>

      <section class="campo-final">
      <div>
        <label for="comentarios">Comentários / Observações:</label>
        <textarea id="comentarios" name="comentarios" placeholder="Deixe seu comentário aqui..."></textarea>
      </div>

      <div>
        <label for="foto">Upload de Foto de Perfil:</label>
        <input type="file" id="foto" name="foto" class="input-file" accept="image/*">
      </div>

      </section>

      <div class="botoes-container">
        <button type="reset" class="btn-limpar">Limpar</button>
        <button type="submit" class="btn-enviar">Enviar Dados</button>
      </div>

    </form>
  </div>

</body>
</html>
