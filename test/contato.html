<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meu Portfólio | Contato</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="navbar">
    <div class="logo">MeuPortfólio</div>
    <nav>
      <a href="index.html">Home</a>
      <a href="projetos.html">Projetos</a>
      <a href="contato.html" class="active">Contato</a>
    </nav>
  </header>

  <main class="container secao-contato">
    <div class="caixa-contato">
      <h2>Vamos conversar?</h2>
      <p>Preencha os campos abaixo para me enviar uma mensagem direta.</p>
      
      <form id="formContato">
        <div class="campo">
          <label for="nome">Nome:</label>
          <input type="text" id="nome" required placeholder="Seu nome">
        </div>

        <div class="campo">
          <label for="email">Email:</label>
          <input type="text" id="email" required placeholder="Seu email">
        </div>
        
        <div class="campo">
          <label for="mensagem">Mensagem:</label>
          <textarea id="mensagem" required placeholder="Sua mensagem aqui..."></textarea>
        </div>
        
        <button type="submit" class="btn-enviar">Enviar Mensagem</button>
      </form>

      <div id="mensagemFeedback" class="feedback-oculto"></div>
    </div>
  </main>

  <footer>
    <p>&copy; 2026 - Desenvolvido com HTML, CSS e JavaScript</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
